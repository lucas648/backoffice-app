<mat-card>
    <mat-card-title class="form-title">{{ userId ? 'Editar Usuário' : 'Novo Usuário' }}</mat-card-title>
    <mat-card-content>
      <form class="form-style" [formGroup]="form">
        <mat-form-field class="full-width input-container">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="name">
          <mat-error *ngIf="form.controls['name'].hasError('required')">
            Nome é obrigatório
          </mat-error>
        </mat-form-field>
  
        <mat-form-field class="full-width input-container">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email">
          <mat-error *ngIf="form.controls['email'].hasError('required')">
            Email é obrigatório
          </mat-error>
          <mat-error *ngIf="form.controls['email'].hasError('email')">
            Email inválido
          </mat-error>
        </mat-form-field>
        <mat-form-field class="full-width input-container">
          <mat-label>Cidade</mat-label>
          <input matInput type="text" formControlName="city">
          <mat-error *ngIf="form.controls['city'].hasError('required')">
            Cidade é obrigatória
          </mat-error>
        </mat-form-field>
        <mat-form-field class="full-width input-container">
          <mat-label>Idade</mat-label>
          <input matInput type="number" formControlName="age">
          <mat-error *ngIf="form.controls['age'].hasError('required')">
            Idade é obrigatória
          </mat-error>
          <mat-error *ngIf="form.controls['age'].hasError('min')">
            Idade deve ser 0 ou maior
          </mat-error>
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions class="button-container">
      <button class="button-style" (click)="save()">Salvar</button>
      <button class="button-style" (click)="cancel()">Cancelar</button>
    </mat-card-actions>
</mat-card>
