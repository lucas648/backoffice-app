<div class="container" style="text-align: center; margin-top: 50px;">
  <h1>Bem vindo ao Backoffice </h1>
  <p>Escolha a opção que deseja manipular:</p>

  <div style="display: flex; justify-content: center; gap: 20px; margin-top: 30px; padding: 16px;">
    <mat-card class="card-style">
      <mat-card-title>Ver Usuários</mat-card-title>
      <mat-card-content>
        <p>Veja e edite a lista de usuários.</p>
      </mat-card-content>
      <mat-card-actions>
        <button class="button-style" (click)="navigateTo('users')">Usuários</button>
      </mat-card-actions>
    </mat-card>

    <mat-card class="card-style">
      <mat-card-title>Ver Produtos</mat-card-title>
      <mat-card-content>
        <p>Ver e editar a lista de produtos.</p>
      </mat-card-content>
      <mat-card-actions>
        <button class="button-style" (click)="navigateTo('products')">Produtos</button>
  </mat-card-actions>
    </mat-card>
  </div>
</div>
