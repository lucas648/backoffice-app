<mat-card>
    <mat-card-title class="form-title">{{ productId ? 'Editar Produto' : 'Novo Produto' }}</mat-card-title>
    <mat-card-content>
      <form class="form-style" [formGroup]="form">
        <mat-form-field class="full-width input-container">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="name">
          <mat-error *ngIf="form.controls['name'].hasError('required')">
            Nome é obrigatório
          </mat-error>
        </mat-form-field>
  
        <mat-form-field class="full-width input-container">
          <mat-label>Preço</mat-label>
          <input matInput type="number" formControlName="price">
          <mat-error *ngIf="form.controls['price'].hasError('required')">
            Preço é obrigatório
          </mat-error>
          <mat-error *ngIf="form.controls['price'].hasError('min')">
            Preço deve ser maior que 0
          </mat-error>
        </mat-form-field>
        <mat-form-field class="full-width input-container">
          <mat-label>Categoria</mat-label>
          <input matInput formControlName="category">
          <mat-error *ngIf="form.controls['category'].hasError('required')">
            Categoria é obrigatória
        </mat-error>
        </mat-form-field>
        <mat-form-field class="full-width input-container">
          <mat-label>Quantidade em Estoque</mat-label>
          <input matInput type="number" formControlName="stock">
          <mat-error *ngIf="form.controls['stock'].hasError('required')">
            Quantidade é obrigatória
          </mat-error>
          <mat-error *ngIf="form.controls['stock'].hasError('min')">
            Quantidade deve ser 0 ou maior
          </mat-error>
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions class="button-container">
      <button class="button-style" (click)="save()">Salvar</button>
      <button class="button-style" (click)="cancel()">Cancelar</button>
    </mat-card-actions>
</mat-card>
