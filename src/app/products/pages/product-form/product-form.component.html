<mat-card>
    <mat-card-title>{{ productId ? 'Editar Produto' : 'Novo Produto' }}</mat-card-title>
    <mat-card-content>
      <form [formGroup]="form">
        <mat-form-field class="full-width">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="name">
          <mat-error *ngIf="form.controls['name'].hasError('required')">
            Nome é obrigatório
          </mat-error>
        </mat-form-field>
  
        <mat-form-field class="full-width">
          <mat-label>Preço</mat-label>
          <input matInput type="number" formControlName="price">
          <mat-error *ngIf="form.controls['price'].hasError('required')">
            Preço é obrigatório
          </mat-error>
          <mat-error *ngIf="form.controls['price'].hasError('min')">
            Preço deve ser maior que 0
          </mat-error>
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="save()">Salvar</button>
      <button mat-button (click)="cancel()">Cancelar</button>
    </mat-card-actions>
</mat-card>
